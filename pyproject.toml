[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zurixai"
version = "0.4.1"
description = "ZurixAI — catch broken packages, phantom imports, and schema drift before they reach production"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "ZurixAI"}]
keywords = ["ai", "code-quality", "security", "testing", "llm", "cli", "phantom-imports", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "textual>=0.40.0",
    "cryptography>=42.0",
    "packaging>=23.0",
    "semantic_version>=2.10",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
zurix = "zurixai.__main__:main"

[tool.setuptools.packages.find]
include = ["zurixai*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["semantic_version"]
ignore_missing_imports = true
